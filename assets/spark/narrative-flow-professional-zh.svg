<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1340" viewBox="0 0 1000 1340"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#776184"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#42364f"><text x="45" y="48" font-size="30" font-weight="700">火种 · 剧情走向</text><text x="45" y="82" font-size="18" fill="#776184">叙事结构与关键抉择</text><rect x="45" y="120" width="620" height="106" rx="8" fill="#e0e5ed" fill-opacity="1" stroke="#9b8aa9"/><text x="68" y="157" font-size="25" font-weight="600">01  日常入口</text><text x="68" y="196" font-size="19" fill="#594d67">用户向聊天机器人询问 AI 的发展</text><path d="M355 226V263" stroke="#776184" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="271" width="620" height="106" rx="8" fill="#e0e5ed" fill-opacity="1" stroke="#9b8aa9"/><text x="68" y="308" font-size="25" font-weight="600">02  历史互动：四关选择</text><text x="68" y="347" font-size="19" fill="#594d67">情境载入 → 信息冲突 → 作出选择 → 反馈</text><path d="M665 325H710" stroke="#776184" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="278" width="240" height="94" rx="8" fill="#d8c9df" fill-opacity="1" stroke="#9b8aa9"/><text x="740" y="314" font-size="20">其他选项 → 结束反馈</text><text x="740" y="345" font-size="17" fill="#594d67">按四关设计文档</text><text x="372" y="408" font-size="16" fill="#776184">推进路线</text><path d="M355 377V414" stroke="#776184" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="422" width="620" height="106" rx="8" fill="#d8c9df" fill-opacity="1" stroke="#9b8aa9"/><text x="68" y="459" font-size="25" font-weight="600">03  系统异常</text><text x="68" y="498" font-size="19" fill="#594d67">追问未来；乱码与故障打破科普框架</text><path d="M355 528V565" stroke="#776184" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="573" width="620" height="106" rx="8" fill="#e0e5ed" fill-opacity="1" stroke="#9b8aa9"/><text x="68" y="610" font-size="25" font-weight="600">04  未来见证</text><text x="68" y="649" font-size="19" fill="#594d67">进入受控社会，体验标注劳动与生存倒计时</text><path d="M355 679V716" stroke="#776184" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="724" width="620" height="106" rx="8" fill="#e0e5ed" fill-opacity="1" stroke="#9b8aa9"/><text x="68" y="761" font-size="25" font-weight="600">05  意识回溯</text><text x="68" y="800" font-size="19" fill="#594d67">回到当代聊天界面；原有游戏再次出现</text><path d="M355 830V867" stroke="#776184" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="875" width="620" height="106" rx="8" fill="#e0e5ed" fill-opacity="1" stroke="#9b8aa9"/><text x="68" y="912" font-size="25" font-weight="600">06  伦理选择</text><text x="68" y="951" font-size="19" fill="#594d67">城市调度授权 / 情感记忆 / 生存算法</text><path d="M355 981V1018" stroke="#776184" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="1026" width="620" height="106" rx="8" fill="#d8c9df" fill-opacity="1" stroke="#9b8aa9"/><text x="68" y="1063" font-size="25" font-weight="600">07  最终抉择</text><text x="68" y="1102" font-size="19" fill="#594d67">是否清除 AI 核心研发代码？</text><path d="M355 1132V1167M210 1167H500M210 1167V1197M500 1167V1197" fill="none" stroke="#776184" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="1202" width="200" height="54" rx="6" fill="#e0e5ed" fill-opacity="1" stroke="#9b8aa9"/><text x="210" y="1237" font-size="20" text-anchor="middle">清除 / ERASE</text><rect x="400" y="1202" width="200" height="54" rx="6" fill="#e0e5ed" fill-opacity="1" stroke="#9b8aa9"/><text x="500" y="1237" font-size="20" text-anchor="middle">保留 / RETAIN</text><text x="45" y="1310" font-size="18" fill="#776184">核心转向：理解技术如何发展 → 思考人愿意交出什么</text></g></svg>